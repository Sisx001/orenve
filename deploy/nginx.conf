# ORYNVE v2 — Nginx server block
# Place this file in /etc/nginx/sites-available/orynve and symlink to sites-enabled.
# Adjust server_name, root paths, and certificate paths for your server.
#
# Run:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then obtain a TLS certificate:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

upstream orynve_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # TLS — certbot will update these paths after running
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large media uploads (Next.js Server Action limit is 35 MB)
    client_max_body_size 35m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Security headers (Next.js also sets these in next.config.ts — Nginx adds them
    # at the edge before the request reaches Node.js, e.g. for 4xx error pages).
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "SAMEORIGIN"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Static uploads (local media storage) ─────────────────────────────────
    # Served directly by Nginx — supports HTTP Range (required for video playback).
    # The path must match UPLOAD_DIR or the default public/uploads location.
    location /uploads/ {
        alias /var/www/orynve/public/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;

        # Enable Range support
        proxy_force_ranges on;

        # Disable directory listing
        autoindex off;

        # Serve files directly; fall through to Node.js /api/media only if not found here
        try_files $uri @orynve_media;
    }

    # Fallback: the portable range-capable media API route
    location @orynve_media {
        proxy_pass         http://orynve_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Next.js static assets (content-addressed, cache forever) ─────────────
    location /_next/static/ {
        proxy_pass         http://orynve_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Everything else → Node.js ─────────────────────────────────────────────
    location / {
        proxy_pass         http://orynve_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout for long-running Server Actions (e.g. large media uploads)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Pass range requests through for the /api/media route
        proxy_set_header   Range $http_range;
        proxy_set_header   If-Range $http_if_range;
    }
}
